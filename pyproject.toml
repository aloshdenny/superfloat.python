[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superfloat"
version = "0.16.0"
description = "sf: the Python library for Superfloat numbers (sf4 to sf16 fixed point) on the Atreides chip: arrays, PyTorch integration and GPU-style kernels."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://superfloat.si"
Documentation = "https://docs.superfloat.si"
Source = "https://github.com/superfloat/superfloat.python"

[project.optional-dependencies]
torch = ["torch>=2.4"]
test = ["pytest>=8", "hypothesis>=6", "numpy>=1.24", "torch>=2.4", "scikit-learn>=1.3"]
hf = ["transformers>=5.20", "accelerate>=1.0"]          # Hugging Face models; tested pins in env/dsl-test.txt
xdist = ["pytest-xdist>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sf.torch" = ["data/*.json"]
"sf.kernels" = ["*.h"]                  # the C backend compiles against it

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: exhaustive sf9/sf10 runs (still every commit; deselect with -m 'not slow' while iterating)",
]
filterwarnings = ["error::sf.SFWarning"]
addopts = "-p no:logging"
