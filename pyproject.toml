[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-python"
version = "0.2.0"
description = "sf: the Python DSL for Superfloat (sf4..sf16 fixed point) on the Atreides GPU. Stages 1.0 and 1.1: scalar arithmetic, arrays and linear algebra."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: exhaustive sf9/sf10 runs (still every commit; deselect with -m 'not slow' while iterating)",
]
filterwarnings = ["error::sf.SFWarning"]
