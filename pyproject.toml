[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-python"
version = "0.3.0"
description = "sf: the Python DSL for Superfloat (sf4..sf16 fixed point) on the Atreides GPU. Stages 1.0, 1.1 and 2: scalar arithmetic, arrays and linear algebra, PyTorch integration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.4"]
test = ["pytest>=8", "hypothesis>=6", "numpy>=1.24", "torch>=2.4", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: exhaustive sf9/sf10 runs (still every commit; deselect with -m 'not slow' while iterating)",
]
filterwarnings = ["error::sf.SFWarning"]
addopts = "-p no:logging"
